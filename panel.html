<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Concentric Panel</title>
    <meta name="description" content="A concentric ring clock for iPhone, as a home screen web app." />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Panel" />
    <link rel="manifest" href="panel.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@200..600&display=swap" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/panel.css" />
  </head>
  <body data-page="panel">
    <main>
      <header class="today-header">
        <div>
          <div class="weekday"></div>
          <div class="full-date"></div>
        </div>
        <div class="week"></div>
      </header>

      <div class="dial-area">
        <div class="dial">
          <div class="rings"></div>
          <div class="hour"></div>
        </div>
      </div>

      <div class="tiles">
        <section class="tile calendar">
          <div class="tile-title calendar-title"></div>
          <div class="calendar-grid"></div>
        </section>

        <section class="tile progress-tile" aria-label="Progress">
          <svg class="progress-rings" viewBox="0 0 100 100" aria-hidden="true">
            <circle class="track" r="44" />
            <circle class="fill" data-ring="day" r="44" pathLength="100" />
            <circle class="track" r="33" />
            <circle class="fill" data-ring="month" r="33" pathLength="100" />
            <circle class="track" r="22" />
            <circle class="fill" data-ring="year" r="22" pathLength="100" />
          </svg>
          <dl class="legend">
            <div><dt>DAY</dt><dd data-label="day"></dd></div>
            <div><dt>MONTH</dt><dd data-label="month"></dd></div>
            <div><dt>YEAR</dt><dd data-label="year"></dd></div>
          </dl>
        </section>
      </div>
    </main>

    <nav class="nav" aria-label="Pages">
      <a href="panel.html" data-page="panel">Panel</a>
      <a href="clock.html" data-page="clock">Clock</a>
      <a href="horizon.html" data-page="horizon">Horizon</a>
    </nav>

    <script src="js/concentric.js"></script>
    <script src="js/panel.js"></script>
  </body>
</html>
